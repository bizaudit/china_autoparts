<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>China AutoParts</title>

    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>

<header class="header">
    <div class="container header-inner">

        <div class="logo">
            <img src="images/logo.png" alt="China AutoParts">
        </div>

        <div class="header-text">
            <h1>China AutoParts</h1>
            <p>Автозапчасти на китайские автомобили</p>
        </div>

<div class="header-right">

    <a href="https://www.instagram.com/china_dag_motors?igsh=ZG82cXB0ZDJwdmo2"
       target="_blank"
       class="icon-link">
        <img src="images/instagram_logo.png" alt="Instagram">
    </a>

    <a href="https://wa.me/message/VURZ2TKA3WSGA1"
       target="_blank"
       class="icon-link">
        <img src="images/whatsapp_logo.png" alt="WhatsApp">
    </a>

    
    <a href="tel:+79288092949" class="phone-link">
        +7 (928) 809-29-49
    </a>

    <div class="header-tools">

      <div class="tool-item" id="compareBtn">
    <div class="tool-icon">
        <img src="images/compare.png" alt="Сравнение">
    </div>
    <span>Сравнение</span>
</div>

     <div class="tool-item" id="cartBtn">
    <div class="tool-icon">
        <img src="images/basket.png" alt="Корзина">
        <span class="tool-count">0</span>
    </div>
    <span>Корзина</span>
</div>

    </div>

</div>
    </div>
</header>

<section class="container">

    <div class="filters">

        <input
            type="text"
            id="searchInput"
            placeholder="Поиск по названию или артикулу">

        <select id="brandFilter">
            <option value="">Все марки</option>
        </select>

        <select id="modelFilter">
            <option value="">Все модели</option>
        </select>

    </div>

    <div id="catalog" class="catalog"></div>

</section>

<script src="js/index.js"></script>

</body>
</html>
